<svg width="1000" height="260" viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a12"/>
      <stop offset="100%" stop-color="#12102a"/>
    </linearGradient>
    <linearGradient id="edgeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="260" fill="url(#bg)"/>

  <!-- layer 1 nodes -->
  <g id="l1">
    <circle cx="90" cy="60" r="5" fill="#22d3ee"/>
    <circle cx="90" cy="110" r="5" fill="#22d3ee"/>
    <circle cx="90" cy="160" r="5" fill="#22d3ee"/>
    <circle cx="90" cy="200" r="5" fill="#22d3ee"/>
  </g>
  <!-- layer 2 nodes -->
  <g id="l2">
    <circle cx="320" cy="45" r="5" fill="#a855f7"/>
    <circle cx="320" cy="90" r="5" fill="#a855f7"/>
    <circle cx="320" cy="135" r="5" fill="#a855f7"/>
    <circle cx="320" cy="180" r="5" fill="#a855f7"/>
    <circle cx="320" cy="220" r="5" fill="#a855f7"/>
  </g>
  <!-- layer 3 nodes -->
  <g id="l3">
    <circle cx="560" cy="60" r="5" fill="#22d3ee"/>
    <circle cx="560" cy="110" r="5" fill="#22d3ee"/>
    <circle cx="560" cy="160" r="5" fill="#22d3ee"/>
    <circle cx="560" cy="200" r="5" fill="#22d3ee"/>
  </g>
  <!-- output node -->
  <circle cx="740" cy="130" r="7" fill="#f472b6"/>

  <!-- connecting edges, drawn once, animated stroke pulse -->
  <g stroke="url(#edgeGrad)" stroke-width="1" fill="none">
    <path d="M90,60 L320,45"><animate attributeName="stroke-opacity" values="0.15;0.9;0.15" dur="3.2s" begin="0s" repeatCount="indefinite"/></path>
    <path d="M90,60 L320,135"><animate attributeName="stroke-opacity" values="0.15;0.9;0.15" dur="2.8s" begin="0.3s" repeatCount="indefinite"/></path>
    <path d="M90,110 L320,90"><animate attributeName="stroke-opacity" values="0.15;0.9;0.15" dur="3.0s" begin="0.6s" repeatCount="indefinite"/></path>
    <path d="M90,110 L320,180"><animate attributeName="stroke-opacity" values="0.15;0.9;0.15" dur="2.6s" begin="0.9s" repeatCount="indefinite"/></path>
    <path d="M90,160 L320,135"><animate attributeName="stroke-opacity" values="0.15;0.9;0.15" dur="3.4s" begin="0.2s" repeatCount="indefinite"/></path>
    <path d="M90,160 L320,220"><animate attributeName="stroke-opacity" values="0.15;0.9;0.15" dur="2.9s" begin="0.5s" repeatCount="indefinite"/></path>
    <path d="M90,200 L320,180"><animate attributeName="stroke-opacity" values="0.15;0.9;0.15" dur="3.1s" begin="0.8s" repeatCount="indefinite"/></path>
    <path d="M90,200 L320,220"><animate attributeName="stroke-opacity" values="0.15;0.9;0.15" dur="2.7s" begin="1.1s" repeatCount="indefinite"/></path>

    <path d="M320,45 L560,60"><animate attributeName="stroke-opacity" values="0.15;0.9;0.15" dur="3.0s" begin="0.4s" repeatCount="indefinite"/></path>
    <path d="M320,90 L560,60"><animate attributeName="stroke-opacity" values="0.15;0.9;0.15" dur="2.8s" begin="0.7s" repeatCount="indefinite"/></path>
    <path d="M320,90 L560,110"><animate attributeName="stroke-opacity" values="0.15;0.9;0.15" dur="3.3s" begin="1.0s" repeatCount="indefinite"/></path>
    <path d="M320,135 L560,110"><animate attributeName="stroke-opacity" values="0.15;0.9;0.15" dur="2.5s" begin="0.1s" repeatCount="indefinite"/></path>
    <path d="M320,135 L560,160"><animate attributeName="stroke-opacity" values="0.15;0.9;0.15" dur="3.2s" begin="0.6s" repeatCount="indefinite"/></path>
    <path d="M320,180 L560,160"><animate attributeName="stroke-opacity" values="0.15;0.9;0.15" dur="2.9s" begin="0.9s" repeatCount="indefinite"/></path>
    <path d="M320,180 L560,200"><animate attributeName="stroke-opacity" values="0.15;0.9;0.15" dur="3.4s" begin="0.3s" repeatCount="indefinite"/></path>
    <path d="M320,220 L560,200"><animate attributeName="stroke-opacity" values="0.15;0.9;0.15" dur="2.6s" begin="1.2s" repeatCount="indefinite"/></path>

    <path d="M560,60 L740,130"><animate attributeName="stroke-opacity" values="0.15;0.9;0.15" dur="3.0s" begin="0.5s" repeatCount="indefinite"/></path>
    <path d="M560,110 L740,130"><animate attributeName="stroke-opacity" values="0.15;0.9;0.15" dur="2.7s" begin="0.8s" repeatCount="indefinite"/></path>
    <path d="M560,160 L740,130"><animate attributeName="stroke-opacity" values="0.15;0.9;0.15" dur="3.1s" begin="1.1s" repeatCount="indefinite"/></path>
    <path d="M560,200 L740,130"><animate attributeName="stroke-opacity" values="0.15;0.9;0.15" dur="2.9s" begin="0.4s" repeatCount="indefinite"/></path>
  </g>

  <!-- pulsing halo on output node -->
  <circle cx="740" cy="130" r="7" fill="none" stroke="#f472b6" stroke-width="2">
    <animate attributeName="r" values="7;22;7" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.9;0;0.9" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- typing terminal line -->
  <text x="800" y="100" font-family="monospace" font-size="14" fill="#22d3ee">&gt; model.predict(</text>
  <text x="800" y="122" font-family="monospace" font-size="14" fill="#a855f7">  Ratnesh.skills</text>
  <text x="800" y="144" font-family="monospace" font-size="14" fill="#22d3ee">)</text>
  <rect x="972" y="132" width="9" height="16" fill="#f472b6">
    <animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite"/>
  </rect>

  <text x="40" y="245" font-family="Verdana, sans-serif" font-size="15" fill="#e2e8f0" letter-spacing="0.5">
    Ratnesh Pathak — AI/ML Engineer building signal from noise
  </text>
</svg>
