<svg width="1000" height="300" viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08070f"/>
      <stop offset="100%" stop-color="#150f2e"/>
    </linearGradient>
    <linearGradient id="edgeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="300" fill="url(#bg)"/>

  <g fill="#ffffff">
    <circle cx="60" cy="20" r="1"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3s" begin="0s" repeatCount="indefinite"/></circle>
